            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .floating-icon { animation: float 3s ease-in-out infinite; }
        
        /* Auto Vanish Animation */
        .vanish-out {
            opacity: 0;
            transform: scale(0.9) translateY(-10px);
            transition: all 0.5s ease-out;
            pointer-events: none;
        }
    </style>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',

        }
        
        function changeCustomLanguage(langCode) {
            let cookieValue = `/en/${langCode}`;
            if(langCode === 'en') { cookieValue = '/en/en'; }
            document.cookie = `googtrans=${cookieValue}; path=/`;
            document.cookie = `googtrans=${cookieValue}; domain=.${location.hostname}; path=/`;
            window.location.reload();
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- FIREBASE -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCLnmqPCaq4fIUNZp-9IkkE1xBOIBhkyKo",
            authDomain: "nusukkeys.firebaseapp.com",
            databaseURL: "https://nusukkeys-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nusukkeys",
            storageBucket: "nusukkeys.firebasestorage.app",
            messagingSenderId: "720218381739",
            appId: "1:720218381739:web:e6c6c63e1849313aefc6ee",
            measurementId: "G-00WTJ7PRPV"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // Dark Mode Logic
        const htmlRoot = document.getElementById('html-root');
        const themeToggleBtn = document.getElementById('themeToggle');
        if (localStorage.getItem('theme') === 'dark') {
            htmlRoot.classList.add('dark');
            themeToggleBtn.innerText = '☀️';
        }
        function toggleDarkMode() {
            htmlRoot.classList.toggle('dark');
            if(htmlRoot.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
                themeToggleBtn.innerText = '☀️';
            } else {
                localStorage.setItem('theme', 'light');
                themeToggleBtn.innerText = '🌙';
            }
        }

        function timeAgo(ms) {
            if (!ms) return "Just now";
            const seconds = Math.floor((new Date() - ms) / 1000);
            if (seconds < 60) return "Just now";
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            return `${Math.floor(hours / 24)}d ago`;
        }

        const ADMIN_KEY = "NG-AsI6QSDd";

        function createKeyHTML(id, text, timestamp, upvotes = 0, downvotes = 0, isAdmin = false) {
            let pinBadge = isAdmin ? `<span class="bg-gradient-to-r from-orange-500 to-orange-400 text-white text-[10px] px-2.5 py-0.5 rounded-full uppercase tracking-wider font-bold mb-1.5 inline-flex items-center gap-1 shadow-sm">📌 Pinned by Admin</span><br>` : '';
            return `
            <div id="key-card-${id}" class="glass-card p-4 rounded-2xl flex flex-col group mb-4 border border-white dark:border-slate-600 hover:border-emerald-300 transition-all hover:shadow-lg">
                <div class="flex justify-between items-center w-full">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 md:w-14 md:h-14 rounded-full bg-gradient-to-br from-orange-100 to-orange-50 dark:from-slate-700 dark:to-slate-600 flex items-center justify-center shadow-inner border border-orange-200/50 dark:border-slate-500">
                            <span class="font-bold text-orange-500 text-xl md:text-2xl">🔑</span>
                        </div>
                        <div>
                            ${pinBadge}
                            <p class="font-mono text-lg md:text-xl font-bold text-emerald-900 tracking-wide notranslate">${text}</p>
                            <p class="text-[10px] md:text-xs text-emerald-600 font-bold mt-1 flex items-center gap-1">🕒 ${timeAgo(timestamp)}</p>
                        </div>
                    </div>
                    <button onclick="copyAndVanish('${id}', '${text}')" class="px-4 py-2 md:px-6 md:py-3 bg-emerald-600 text-white font-bold rounded-full hover:bg-orange-500 transition-all active:scale-95 shadow-md notranslate text-sm md:text-base">Copy</button>
                </div>
                <div class="mt-3 flex items-center gap-2 border-t border-emerald-100 dark:border-slate-600 pt-3">
                    <button onclick="voteKey('${id}', 'upvotes')" class="flex items-center gap-1 bg-white dark:bg-slate-700 px-3 py-1 rounded-full text-xs font-bold text-emerald-700 hover:bg-emerald-50 border border-emerald-100 dark:border-slate-500 transition-all active:scale-95">👍 <span>${upvotes}</span></button>
                    <button onclick="voteKey('${id}', 'downvotes')" class="flex items-center gap-1 bg-white dark:bg-slate-700 px-3 py-1 rounded-full text-xs font-bold text-red-500 hover:bg-red-50 border border-red-100 dark:border-slate-500 transition-all active:scale-95">👎 <span>${downvotes}</span></button>
                </div>
            </div>`;
        }

        // Fetch and Render Keys
        db.ref('keys').limitToLast(50).on('value', (snapshot) => {
            const container = document.getElementById('keys-container');
            container.innerHTML = '';
            
            let copiedKeys = JSON.parse(localStorage.getItem('copiedKeys') || '[]');
            let total = 0;
            let keysArray = [];
            
            snapshot.forEach((child) => {
                keysArray.push({ id: child.key, data: child.val() });
            });
            keysArray.reverse(); // Show newest first

            // 1. Render Admin Key at the top (if not copied yet)
            if (!copiedKeys.includes('admin-key-fixed')) {
                total++;
                container.innerHTML += createKeyHTML('admin-key-fixed', ADMIN_KEY, Date.now(), 99, 0, true);
            }

            // 2. Render other keys
            keysArray.forEach(item => {
                // Ignore if it's already copied OR if it's the admin key (handled above)
                if (!copiedKeys.includes(item.id) && item.data.text !== ADMIN_KEY) {
                    total++;
                    container.innerHTML += createKeyHTML(item.id, item.data.text, item.data.timestamp, item.data.upvotes || 0, item.data.downvotes || 0, false);
                }
            });
            
            document.getElementById('stat-keys').innerText = total;
            document.getElementById('stat-avail').innerText = total;
            
            if(total === 0) {
                container.innerHTML = `
                <div class="glass-card p-12 text-center rounded-3xl border border-dashed border-emerald-300">
                    <span class="text-4xl block mb-3 opacity-50">📭</span>
                    <p class="text-emerald-700 font-bold text-lg">All keys used up!</p>
                    <p class="text-emerald-500 text-sm mt-1">Wait for someone to share more.</p>
                </div>`;
            }
        });

        // Copy Bug Fix & Vanish System
        function copyAndVanish(id, text) {
            // Fallback Copy Function (Works without HTTPS/SSL)
            const fallbackCopy = (text) => {
                let textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    triggerVanish(id);
                } catch (err) {
                    showToast('❌ Copy failed! Your browser blocked it.');
                }
                document.body.removeChild(textArea);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => triggerVanish(id)).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        // Auto Vanish & Save to LocalStorage
        function triggerVanish(id) {
            showToast('📋 Key Copied & Vanished!');
            
            // Save to LocalStorage so it never shows again
            let copiedKeys = JSON.parse(localStorage.getItem('copiedKeys') || '[]');
            if (!copiedKeys.includes(id)) {
                copiedKeys.push(id);
                localStorage.setItem('copiedKeys', JSON.stringify(copiedKeys));
            }

            // Animate out
            let card = document.getElementById('key-card-' + id);
            if (card) {
                card.classList.add('vanish-out');
                setTimeout(() => {
                    card.remove();
                    // Update Live Stats
                    let statKeys = document.getElementById('stat-keys');
                    let statAvail = document.getElementById('stat-avail');
                    statKeys.innerText = Math.max(0, parseInt(statKeys.innerText) - 1);
                    statAvail.innerText = Math.max(0, parseInt(statAvail.innerText) - 1);
                }, 500);
            }
        }

        // Vote, Share & Switch Tab Logic
        function voteKey(keyId, type) {
            if(keyId === 'admin-key-fixed') { showToast('Thanks for voting!'); return; }
            db.ref(`keys/${keyId}/${type}`).transaction((current) => (current || 0) + 1);
            showToast('Thanks for voting!');
        }

        function shareWebsite() {
            if (navigator.share) {
                navigator.share({ title: 'Nusuk Keys Exchange', url: 'https://nusuk.bond' });
            } else {
                navigator.clipboard.writeText('https://nusuk.bond');
                showToast('🔗 Website link copied!');
            }
        }

        function submitKeysToFirebase() {
            const area = document.getElementById('keyInputArea');
            const lines = area.value.split('\n').map(l => l.trim()).filter(l => l.startsWith('NG-') || l.includes('nusuk'));
            if(lines.length === 0) { showToast('❌ Enter valid keys starting with NG-'); return; }
            
            lines.forEach(keyText => {
                db.ref('keys').push({
                    text: keyText,
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    upvotes: 0, downvotes: 0
                });
            });
            area.value = '';
            showToast(`✅ ${lines.length} Key(s) Shared!`);
            setTimeout(() => { switchTab('keys'); }, 1200);
        }

        function switchTab(tab) {
            const keysSec = document.getElementById('section-keys');
            const shareSec = document.getElementById('section-share');
            const btnKeys = document.getElementById('tab-btn-keys');
            const btnShare = document.getElementById('tab-btn-share');

            if(tab === 'keys') {
                keysSec.classList.remove('hidden'); shareSec.classList.add('hidden');
                btnKeys.className = "flex-1 py-3.5 rounded-full bg-emerald-600 text-white font-bold shadow-md transition-all";
                btnShare.className = "flex-1 py-3.5 rounded-full text-emerald-800 dark:text-emerald-400 font-bold hover:bg-emerald-50 dark:hover:bg-slate-700 transition-all";
            } else {
                keysSec.classList.add('hidden'); shareSec.classList.remove('hidden');
                btnShare.className = "flex-1 py-3.5 rounded-full bg-orange-500 text-white font-bold shadow-md transition-all";
                btnKeys.className = "flex-1 py-3.5 rounded-full text-emerald-800 dark:text-emerald-400 font-bold hover:bg-emerald-50 dark:hover:bg-slate-700 transition-all";
            }
        }
        
        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-24', 'opacity-0'), 2500);
        }
    </script>
</body>
</html>
