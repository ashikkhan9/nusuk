<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nusuk Keys - Premium Exchange</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDK (Compat Version for Easy Setup) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #ecfdf5;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2310b981' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            background-attachment: fixed;
            color: #064e3b;
        }
        h1, .islamic-font { font-family: 'Amiri', serif; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(16, 185, 129, 0.3);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        /* 100% HIDE GOOGLE TRANSLATE UGLY WIDGET */
        #google_translate_element { display: none !important; }
        .goog-te-banner-frame { display: none !important; } 
        body { top: 0px !important; }
        .skiptranslate { display: none !important; }
    </style>
</head>
<body class="antialiased relative min-h-screen">

    <div class="absolute top-0 left-0 w-72 h-72 bg-emerald-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 -z-10"></div>
    <div class="absolute top-40 right-0 w-72 h-72 bg-orange-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 -z-10"></div>

    <!-- Hidden Google Translate Element -->
    <div id="google_translate_element"></div>

    <!-- Header -->
    <header class="glass-card sticky top-0 z-50 border-b border-white/50 notranslate">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-emerald-600 to-emerald-400 flex justify-center items-center shadow-lg shadow-emerald-500/30">
                    <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10c1.06 0 2.09-.16 3.06-.47C10.66 20.35 7.5 16.53 7.5 12c0-4.53 3.16-8.35 7.56-9.53C14.09 2.16 13.06 2 12 2z"/></svg>
                </div>
                <div class="text-center md:text-left">
                    <h1 class="text-2xl font-bold text-emerald-800 islamic-font tracking-wide">Nusuk Keys</h1>
                    <p class="text-xs font-semibold text-orange-500 uppercase tracking-widest">Community Exchange</p>
                </div>
            </div>
            
            <!-- Custom Language Buttons -->
            <div class="flex justify-center items-center gap-2">
                <button onclick="changeCustomLanguage('en')" class="px-4 py-2 bg-white/80 hover:bg-orange-100 text-emerald-800 border border-emerald-200 rounded-full text-xs font-bold shadow-sm transition-all">Eng</button>
                <button onclick="changeCustomLanguage('bn')" class="px-4 py-2 bg-white/80 hover:bg-orange-100 text-emerald-800 border border-emerald-200 rounded-full text-xs font-bold shadow-sm transition-all">বাংলা</button>
                <button onclick="changeCustomLanguage('ar')" class="px-4 py-2 bg-white/80 hover:bg-orange-100 text-emerald-800 border border-emerald-200 rounded-full text-xs font-bold shadow-sm transition-all islamic-font text-sm">العربية</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 relative z-10">
        
        <div class="grid grid-cols-2 gap-4 mb-8 max-w-2xl mx-auto">
            <div class="glass-card p-5 rounded-3xl text-center">
                <p class="text-xs font-bold text-orange-600 uppercase mb-1">Total Keys</p>
                <p id="stat-keys" class="text-3xl font-bold text-emerald-800 notranslate">0</p>
            </div>
            <div class="glass-card p-5 rounded-3xl text-center border-emerald-300">
                <p class="text-xs font-bold text-emerald-700 uppercase mb-1">Available</p>
                <p id="stat-avail" class="text-3xl font-bold text-orange-600 notranslate">0</p>
            </div>
        </div>

        <div class="flex p-1.5 glass-card rounded-full mb-8 w-full max-w-sm mx-auto shadow-inner notranslate">
            <button id="tab-btn-keys" onclick="switchTab('keys')" class="flex-1 py-3 rounded-full bg-emerald-600 text-white font-bold shadow-md transition-all">Active Keys</button>
            <button id="tab-btn-share" onclick="switchTab('share')" class="flex-1 py-3 rounded-full text-emerald-800 font-bold hover:bg-white/50 transition-all">Share Key</button>
        </div>

        <!-- ================= KEYS TAB ================= -->
        <div id="section-keys">
            <div id="keys-container" class="space-y-4 mb-8">
                <!-- Loading Animation -->
                <div class="text-center py-10">
                    <div class="inline-block w-8 h-8 border-4 border-emerald-500 border-t-orange-500 rounded-full animate-spin mb-3"></div>
                    <p class="text-emerald-700 font-medium">Bismillah... Fetching Keys</p>
                </div>
            </div>
        </div>

        <!-- ================= SHARE TAB ================= -->
        <div id="section-share" class="hidden">
            <div class="glass-card p-8 rounded-3xl text-center max-w-2xl mx-auto">
                <h2 class="text-2xl font-bold text-emerald-800 mb-2 islamic-font">Share Your Keys</h2>
                <p class="text-sm font-medium text-orange-600 mb-6">Help the community perform their Nusuk easily.</p>
                
                <textarea id="keyInputArea" rows="6" class="w-full glass-input rounded-2xl p-4 text-emerald-900 font-mono outline-none focus:border-orange-500 focus:ring-2 notranslate resize-none" placeholder="Paste NG-N0S2eEMN here..."></textarea>
                
                <button onclick="submitKeysToFirebase()" class="w-full mt-6 bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-orange-500 hover:to-orange-400 text-white font-bold py-4 rounded-full shadow-lg transition-all text-lg notranslate">
                    Submit Keys
                </button>
            </div>
        </div>

    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 font-bold flex items-center gap-2 notranslate">
        <span id="toast-msg">Success</span>
    </div>

    <!-- Google Translate Script -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en', 
                includedLanguages: 'en,bn,ar,ku',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE, 
                autoDisplay: false
            }, 'google_translate_element');
        }
        
        function changeCustomLanguage(langCode) {
            let selectField = document.querySelector(".goog-te-combo");
            if(selectField) { 
                selectField.value = langCode; 
                selectField.dispatchEvent(new Event('change')); 
            } else {
                showToast('Translator is loading, please wait...');
            }
        }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- FIREBASE SCRIPT (REAL DATA) -->
    <script>
        // Your Exact Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCLnmqPCaq4fIUNZp-9IkkE1xBOIBhkyKo",
            authDomain: "nusukkeys.firebaseapp.com",
            databaseURL: "https://nusukkeys-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nusukkeys",
            storageBucket: "nusukkeys.firebasestorage.app",
            messagingSenderId: "720218381739",
            appId: "1:720218381739:web:e6c6c63e1849313aefc6ee",
            measurementId: "G-00WTJ7PRPV"
        };
        
        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        // Load Keys from Database
        db.ref('keys').limitToLast(50).on('value', (snapshot) => {
            const container = document.getElementById('keys-container');
            container.innerHTML = '';
            let total = 0;
            
            snapshot.forEach((child) => {
                total++;
                const data = child.val();
                
                container.innerHTML = `
                <div class="glass-card p-4 rounded-2xl flex justify-between items-center group mb-3">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-orange-100 to-orange-50 flex items-center justify-center shadow-inner">
                            <span class="font-bold text-orange-500 text-xl">🔑</span>
                        </div>
                        <div>
                            <p class="font-mono text-xl font-bold text-emerald-900 notranslate" id="${child.key}">${data.text}</p>
                            <p class="text-xs text-emerald-600/70 font-semibold mt-0.5">Ready to use</p>
                        </div>
                    </div>
                    <button onclick="copyKey('${child.key}')" class="px-5 py-2.5 bg-emerald-600 text-white font-bold rounded-full hover:bg-orange-500 transition-all notranslate shadow-sm">Copy</button>
                </div>` + container.innerHTML;
            });
            
            document.getElementById('stat-keys').innerText = total;
            document.getElementById('stat-avail').innerText = total;
            
            if(total === 0) {
                container.innerHTML = '<div class="glass-card p-10 text-center rounded-3xl"><p class="text-orange-600 font-bold">No keys yet. Be the first to share!</p></div>';
            }
        });

        // Submit Keys to Database
        function submitKeysToFirebase() {
            const area = document.getElementById('keyInputArea');
            const lines = area.value.split('\n').map(l => l.trim()).filter(l => l.startsWith('NG-') || l.includes('nusuk'));
            
            if(lines.length === 0) {
                showToast('Please enter valid keys starting with NG-');
                return;
            }
            
            lines.forEach(keyText => {
                db.ref('keys').push({
                    text: keyText,
                    timestamp: firebase.database.ServerValue.TIMESTAMP,
                    status: 'active'
                });
            });
            
            area.value = '';
            showToast(`${lines.length} Key(s) Submitted Successfully!`);
            
            // Switch back to keys tab automatically
            setTimeout(() => {
                switchTab('keys');
            }, 1000);
        }

        // Utility Functions
        function copyKey(id) {
            navigator.clipboard.writeText(document.getElementById(id).innerText);
            showToast('Key Copied to Clipboard!');
        }
        
        function switchTab(tab) {
            const keysSec = document.getElementById('section-keys');
            const shareSec = document.getElementById('section-share');
            const btnKeys = document.getElementById('tab-btn-keys');
            const btnShare = document.getElementById('tab-btn-share');

            if(tab === 'keys') {
                keysSec.classList.remove('hidden');
                shareSec.classList.add('hidden');
                btnKeys.className = "flex-1 py-3 rounded-full bg-emerald-600 text-white font-bold shadow-md transition-all";
                btnShare.className = "flex-1 py-3 rounded-full text-emerald-800 font-bold hover:bg-white/50 transition-all";
            } else {
                keysSec.classList.add('hidden');
                shareSec.classList.remove('hidden');
                btnShare.className = "flex-1 py-3 rounded-full bg-orange-500 text-white font-bold shadow-md transition-all";
                btnKeys.className = "flex-1 py-3 rounded-full text-emerald-800 font-bold hover:bg-white/50 transition-all";
            }
        }
        
        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-20', 'opacity-0'), 2500);
        }
    </script>
</body>
</html>
