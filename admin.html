<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin - Nusuk Keys</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-6">

    <!-- Simple Security Check (Basic Client-Side Protection) -->
    <script>
        const pass = prompt("Enter Admin Password:");
        if(pass !== "atikadmin123") { // পাসওয়ার্ড আপনার ইচ্ছামতো চেঞ্জ করে নিবেন
            document.body.innerHTML = "<h1 class='text-center text-red-500 mt-20 text-2xl'>Access Denied</h1>";
            throw new Error("Wrong Password");
        }
    </script>

    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-slate-800 mb-6">👑 Master Admin Dashboard</h1>
        
        <!-- Stats & Ad Revenue Tracking -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-500">
                <p class="text-slate-500 text-sm">Total Site Visits</p>
                <p id="admin-visitors" class="text-3xl font-bold">Loading...</p>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-emerald-500">
                <p class="text-slate-500 text-sm">Active Keys in DB</p>
                <p id="admin-keys" class="text-3xl font-bold">Loading...</p>
            </div>
            <!-- Ad Revenue (Manual update or API linked later) -->
            <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-yellow-500">
                <p class="text-slate-500 text-sm">Est. Ad Revenue (Monetag/Adsterra)</p>
                <p class="text-2xl font-bold text-yellow-600">Check Dashboard</p>
                <a href="https://monetag.com" target="_blank" class="text-xs text-blue-500 underline">Login to Ad Network</a>
            </div>
        </div>

        <!-- Manage Keys Table -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <div class="p-4 border-b border-slate-200 bg-slate-50 flex justify-between">
                <h2 class="font-bold text-lg">Manage Shared Keys (Live)</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-100 text-sm text-slate-500">
                        <tr>
                            <th class="p-4">Key Value</th>
                            <th class="p-4">Time Added</th>
                            <th class="p-4">Action</th>
                        </tr>
                    </thead>
                    <tbody id="admin-keys-list" class="divide-y divide-slate-200">
                        <!-- Keys load here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // FIREBASE SETUP (Main সাইটের সেইম কনফিগ এখানেও দিবেন)
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. Stats
        db.ref('stats/visitors').on('value', s => document.getElementById('admin-visitors').innerText = s.val() || 0);
        
        // 2. Load and Manage Keys
        db.ref('keys').on('value', snapshot => {
            const tbody = document.getElementById('admin-keys-list');
            tbody.innerHTML = '';
            let count = 0;
            snapshot.forEach(child => {
                count++;
                const data = child.val();
                const date = new Date(data.timestamp).toLocaleString();
                tbody.innerHTML = `
                <tr class="hover:bg-slate-50">
                    <td class="p-4 font-mono font-bold">${data.text}</td>
                    <td class="p-4 text-sm text-slate-500">${date}</td>
                    <td class="p-4">
                        <button onclick="deleteKey('${child.key}')" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm">Delete Spam</button>
                    </td>
                </tr>` + tbody.innerHTML;
            });
            document.getElementById('admin-keys').innerText = count;
        });

        // 3. Delete Function
        function deleteKey(keyId) {
            if(confirm("Are you sure you want to delete this key?")) {
                db.ref('keys/' + keyId).remove();
            }
        }
    </script>
</body>
</html>
